version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Verus/vstd upgrades require synchronized lock updates and proof review.
    groups:
      verus:
        patterns: ["vstd", "verus*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Update Actions manually; keep automatic version-update PRs disabled.
    open-pull-requests-limit: 0
