name: Full negative regression

on:
  workflow_dispatch:
    inputs:
      include_macos:
        description: Also run the complete mutation suite on Apple Silicon macOS
        required: true
        default: false
        type: boolean
      include_macos_intel:
        description: Also run the complete mutation suite on Intel macOS
        required: true
        default: false
        type: boolean
      diagnostic_keep_going:
        description: Collect all mutant outcomes after failures (diagnostic only; no accepted regression report)
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: negative-regression-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: Plan independent mutation regression
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      preflight: ${{ steps.matrix.outputs.preflight }}
      negative: ${{ steps.matrix.outputs.negative }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Generate matching preflight and negative matrices
        id: matrix
        run: python3 scripts/negative-shards.py plan --github-output "$GITHUB_OUTPUT" ${{ inputs.include_macos && '--include-macos' || '' }} ${{ inputs.include_macos_intel && '--include-macos-intel' || '' }}

  preflight:
    name: Negative baseline preflight (${{ matrix.os }})
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.preflight) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.preflightMinutes }}
    env:
      CARGO_TERM_COLOR: never
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install checksum-locked Verus and Rust
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/install-verus.sh
      - name: Diagnose unchanged full-crate baseline before fan-out
        run: exec python3 scripts/negative-shards.py preflight --output target/negative-preflight --threads ${{ matrix.threads }} --timeout ${{ matrix.timeout }}
      - name: Summarize baseline results before artifact upload
        if: always()
        run: python3 scripts/summarize-negative.py --input target/negative-preflight --github-summary "$GITHUB_STEP_SUMMARY"
      - name: Retain baseline diagnostics, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: preflight-${{ github.run_attempt }}-${{ matrix.os }}
          path: target/negative-preflight/
          if-no-files-found: warn
          retention-days: 14

  negative:
    name: Full negatives (${{ matrix.os }}, shard ${{ matrix.shard }})
    needs: [plan, preflight]
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix: ${{ fromJSON(needs.plan.outputs.negative) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.shardMinutes }}
    env:
      CARGO_TERM_COLOR: never
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install checksum-locked Verus and Rust
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/install-verus.sh
      - name: Download this platform's positive baseline from this attempt
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: preflight-${{ github.run_attempt }}-${{ matrix.os }}
          path: target/negative-preflight
      - name: Verify this shard as complete crates
        shell: bash
        env:
          DIAGNOSTIC_KEEP_GOING: ${{ inputs.diagnostic_keep_going }}
        run: |
          diagnostic_args=()
          if [[ "$DIAGNOSTIC_KEEP_GOING" == "true" ]]; then
            diagnostic_args+=(--keep-going)
          fi
          exec python3 scripts/negative-shards.py run --shard-index ${{ matrix.shard }} --shard-count ${{ matrix.shardCount }} --output target/negative-shard --jobs 1 --threads ${{ matrix.threads }} --timeout ${{ matrix.timeout }} --compile-timeout ${{ matrix.compileTimeout }} --preflight target/negative-preflight "${diagnostic_args[@]}"
      - name: Summarize negative results before artifact upload
        if: always()
        run: python3 scripts/summarize-negative.py --input target/negative-shard --github-summary "$GITHUB_STEP_SUMMARY"
      - name: Retain negative evidence, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: negative-${{ github.run_attempt }}-${{ matrix.os }}-shard-${{ matrix.shard }}
          path: target/negative-shard/
          if-no-files-found: warn
          retention-days: 14

  collect:
    name: Validate complete regression (${{ matrix.os }})
    needs: [plan, negative]
    if: ${{ !inputs.diagnostic_keep_going }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.preflight) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install checksum-locked Verus and Rust
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/install-verus.sh
      - name: Download this platform's complete negative shards from this attempt
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: negative-${{ github.run_attempt }}-${{ matrix.os }}-shard-*
          path: target/full-negative-shards
      - name: Check raw proof evidence and the exact complete mutation manifest
        run: python3 scripts/negative-shards.py collect --input target/full-negative-shards --output target/proof-negative
      - name: Retain independent regression results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: negative-regression-${{ github.run_attempt }}-${{ matrix.os }}
          path: target/proof-negative/
          if-no-files-found: warn
          retention-days: 14
