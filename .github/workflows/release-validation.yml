name: Full release validation

on:
  workflow_dispatch:
    inputs:
      include_macos_intel:
        description: Also require full validation and runtime assets for Intel macOS
        required: true
        default: false
        type: boolean
      diagnostic_keep_going:
        description: Collect all mutant outcomes after individual failures (diagnostic only; no release acceptance)
        required: true
        default: false
        type: boolean
      create_draft:
        description: Create a private/draft runtime prerelease only after all full quality jobs pass
        required: true
        default: false
        type: boolean
      release_tag:
        description: New tag for the draft runtime prerelease (required when create_draft is true)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: Plan platform proof budgets
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      preflight: ${{ steps.matrix.outputs.preflight }}
      negative: ${{ steps.matrix.outputs.negative }}
      quality: ${{ steps.matrix.outputs.quality }}
      targets: ${{ steps.matrix.outputs.targets }}
    steps:
      - name: Reject diagnostic runs that request a draft release
        shell: bash
        env:
          DIAGNOSTIC_KEEP_GOING: ${{ inputs.diagnostic_keep_going }}
          CREATE_DRAFT: ${{ inputs.create_draft }}
        run: |
          if [[ "$DIAGNOSTIC_KEEP_GOING" == "true" && "$CREATE_DRAFT" == "true" ]]; then
            echo "::error::diagnostic_keep_going=true cannot be combined with create_draft=true"
            exit 1
          fi
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Generate matching preflight and negative matrices
        id: matrix
        run: python3 scripts/negative-shards.py plan --github-output "$GITHUB_OUTPUT" ${{ inputs.include_macos_intel && '--include-macos-intel' || '' }}

  preflight:
    name: Negative baseline preflight (${{ matrix.os }})
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.preflight) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.preflightMinutes }}
    env:
      CARGO_TERM_COLOR: never
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Check requested draft tag before running the full gate
        if: ${{ inputs.create_draft }}
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          python3 - <<'PYCODE'
          import os, re
          if not re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9_.-]*', os.environ['RELEASE_TAG']):
              raise SystemExit('A new, simple release tag is required for create_draft=true')
          PYCODE
      - name: Install checksum-locked Verus and Rust
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/install-verus.sh
      - name: Diagnose unchanged full-crate baseline before fan-out
        run: exec python3 scripts/negative-shards.py preflight --output target/negative-preflight --threads ${{ matrix.threads }} --timeout ${{ matrix.timeout }}
      - name: Retain baseline diagnostics, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: preflight-${{ github.run_attempt }}-${{ matrix.os }}
          path: target/negative-preflight/
          if-no-files-found: warn
          retention-days: 14

  negative:
    name: Full negatives (${{ matrix.os }}, shard ${{ matrix.shard }})
    needs: [plan, preflight]
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix: ${{ fromJSON(needs.plan.outputs.negative) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.shardMinutes }}
    env:
      CARGO_TERM_COLOR: never
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Check requested draft tag before running the full gate
        if: ${{ inputs.create_draft }}
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          python3 - <<'PYCODE'
          import os, re
          if not re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9_.-]*', os.environ['RELEASE_TAG']):
              raise SystemExit('A new, simple release tag is required for create_draft=true')
          PYCODE
      - name: Install checksum-locked Verus and Rust
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/install-verus.sh
      - name: Download this platform's positive baseline from this attempt
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: preflight-${{ github.run_attempt }}-${{ matrix.os }}
          path: target/negative-preflight
      - name: Verify this shard as complete crates
        shell: bash
        env:
          DIAGNOSTIC_KEEP_GOING: ${{ inputs.diagnostic_keep_going }}
        run: |
          diagnostic_args=()
          if [[ "$DIAGNOSTIC_KEEP_GOING" == "true" ]]; then
            diagnostic_args+=(--keep-going)
          fi
          exec python3 scripts/negative-shards.py run --shard-index ${{ matrix.shard }} --shard-count ${{ matrix.shardCount }} --output target/negative-shard --jobs 1 --threads ${{ matrix.threads }} --timeout ${{ matrix.timeout }} --compile-timeout ${{ matrix.compileTimeout }} --preflight target/negative-preflight "${diagnostic_args[@]}"
      - name: Retain negative evidence, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: negative-${{ github.run_attempt }}-${{ matrix.os }}-shard-${{ matrix.shard }}
          path: target/negative-shard/
          if-no-files-found: warn
          retention-days: 14

  quality:
    name: Full quality (${{ matrix.os }})
    needs: [plan, negative]
    if: ${{ !inputs.diagnostic_keep_going }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.quality) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    env:
      CARGO_TERM_COLOR: never
      RUST_BACKTRACE: "1"
      CORDIS_VERUS_THREADS: "2"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Check requested draft tag before running the full gate
        if: ${{ inputs.create_draft }}
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          python3 - <<'PYCODE'
          import os, re
          if not re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9_.-]*', os.environ['RELEASE_TAG']):
              raise SystemExit('A new, simple release tag is required for create_draft=true')
          PYCODE
      - name: Install pinned Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.22.0'
      - name: Install locked JavaScript dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Install checksum-locked Verus and Rust
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/install-verus.sh
      - name: Download this platform's complete negative shards from this attempt
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: negative-${{ github.run_attempt }}-${{ matrix.os }}-shard-*
          path: target/full-negative-shards
      - name: Complete full-crate negative and release-quality gate
        run: exec python3 scripts/record-verification.py --negative-shards target/full-negative-shards
      - name: Assemble this host's audited native bundle
        run: node scripts/package-native.mjs --output target/release-artifacts/native packages/compat-cordis/native
      - name: Stage runtime release assets from the full gate
        run: python3 scripts/package-runtime-release.py package
      - name: Install release assets in a new project without compiling sources
        run: |
          node scripts/install-cordis.mjs --from-directory target/github-release --project "$RUNNER_TEMP/cordis-release-consumer"
          cd "$RUNNER_TEMP/cordis-release-consumer"
          npm start
          npm ci --offline --ignore-scripts --no-audit --no-fund
          npm start
      - name: Retain full validation evidence, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: full-validation-${{ github.run_attempt }}-${{ matrix.os }}
          path: |
            docs/verification-report.json
            target/validation/quality.log
            target/proof-negative/*.json
            target/proof-negative/*.txt
            target/full-negative-shards/
            target/release-artifacts/*.crate
            target/release-artifacts/package-report.json
            target/node-compat/build.json
            target/release-artifacts/npm/
            target/release-artifacts/native/
            target/github-release/
          if-no-files-found: warn
          retention-days: 14

  draft-release:
    name: Collect and upload a draft runtime prerelease
    needs: [plan, quality]
    if: ${{ inputs.create_draft && !inputs.diagnostic_keep_going }}
    runs-on: ubuntu-24.04
    env:
      RELEASE_TARGETS_JSON: ${{ needs.plan.outputs.targets }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Download this run's successful full-quality artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: full-validation-${{ github.run_attempt }}-*
          path: ${{ runner.temp }}/downloaded
      - name: Validate and collect the exact selected platform asset sets
        run: python3 scripts/package-runtime-release.py collect --input "$RUNNER_TEMP/downloaded" --output "$RUNNER_TEMP/release-assets" --commit "$GITHUB_SHA" --targets-json "$RELEASE_TARGETS_JSON"
      - name: Create draft prerelease with tested runtime packages
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path
          tag = os.environ['RELEASE_TAG']
          repository = os.environ['GITHUB_REPOSITORY']
          if not re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9_.-]*', tag):
              raise SystemExit('A new, simple release tag is required')
          existing = subprocess.run(['gh', 'api', f'repos/{repository}/git/ref/tags/{tag}'], capture_output=True, text=True)
          if existing.returncode == 0:
              raise SystemExit('Refusing to reuse an existing tag')
          if 'HTTP 404' not in existing.stderr:
              raise SystemExit('Could not establish that the release tag is unused: ' + existing.stderr)
          notes = Path('runtime-release-notes.md')
          labels = {'linux-x64-gnu-napi8': 'Linux x64 GNU', 'darwin-arm64-napi8': 'macOS Apple Silicon', 'darwin-x64-napi8': 'macOS Intel'}
          platforms = ', '.join(labels[target] for target in json.loads(os.environ['RELEASE_TARGETS_JSON']))
          notes.write_text('Precompiled Node compatibility runtime for ' + platforms + '.\n\n'
                           'All selected platforms passed the full release quality gate, including every required full-crate negative control, package installation and native smoke checks.\n\n'
                           'This is an experimental runtime prerelease, not the complete Harness application. The kernel proof scope has not expanded; paper-wide completion is not claimed. Node.js 22.22+ is required; the exact accepted runtime is recorded in each asset manifest. See docs/native-distribution.md for installation and platform limits.\n\n'
                           'Assets bind to commit ' + os.environ['GITHUB_SHA'] + '. Review this draft before publishing.\n')
          assets = [str(path) for path in sorted((Path(os.environ['RUNNER_TEMP']) / 'release-assets').iterdir())]
          subprocess.run(['gh', 'release', 'create', tag, '--repo', repository, '--target', os.environ['GITHUB_SHA'],
                          '--draft', '--prerelease', '--title', 'Cordis runtime ' + tag, '--notes-file', str(notes), *assets], check=True)
          PY
