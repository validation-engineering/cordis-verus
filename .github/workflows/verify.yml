name: Development checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: development-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  development:
    name: Development (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: never
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.22.0'
      - name: Install locked JavaScript dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Install checksum-locked Verus and Rust
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/install-verus.sh
      - name: Whole positive proof, tests, docs and package checks
        run: python3 scripts/record-development.py
      - name: Assemble this host's audited native bundle
        run: node scripts/package-native.mjs --output target/release-artifacts/native packages/compat-cordis/native
      - name: Retain development evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: development-${{ matrix.os }}
          path: |
            docs/development-report.json
            target/development/checks.log
            target/release-artifacts/*.crate
            target/release-artifacts/package-report.json
            target/node-compat/build.json
            target/release-artifacts/npm/
            target/release-artifacts/native/
          if-no-files-found: warn
          retention-days: 14
