[package]
name = "cordis-node"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Node-API host for the Cordis lifecycle driver"
readme = "README.md"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
test = false
doctest = false

[dependencies]
cordis-plugin-api = { path = "../cordis-plugin-api", version = "=0.1.0" }
libloading = "=0.9.0"
sha2 = "=0.10.9"
cordis = { path = "../cordis", version = "=0.1.0" }
cordis-driver = { path = "../cordis-driver", version = "=0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

napi = { version = "=3.14.0", default-features = false, features = ["napi8", "dyn-symbols"] }
napi-derive = "=3.6.12"

[build-dependencies]
napi-build = "=2.6.0"

# napi/ctor generate the audited FFI glue and internally allow unsafe code.
# Keep handwritten binding code denied except the audited dynamic_ffi module; every other crate retains workspace forbid.
[lints.rust]
unsafe_code = "deny"

[[example]]
name = "interop_fixture"
crate-type = ["cdylib"]
