[package]
name = "cordis-kernel"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
documentation = "https://docs.rs/cordis-kernel"
description = "Executable Verus-verified Cordis lifecycle kernel"
readme = "README.md"
keywords = ["verus", "verification", "plugins", "lifecycle"]
categories = ["development-tools"]
include = ["src/**", "tests/**", "examples/**", "Cargo.toml", "README.md", "LICENSE", "NOTICE"]
publish = ["crates-io"]

[dependencies]
vstd = "=0.0.0-2026-09-20-0158"

[package.metadata.verus]
verify = true

[lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(verus_keep_ghost)", "cfg(verus_keep_ghost_body)", "cfg(verus_only)"] }
