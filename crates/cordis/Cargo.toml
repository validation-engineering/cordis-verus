[package]
name = "cordis-verus"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
documentation = "https://docs.rs/cordis-verus"
description = "Typed Rust Cordis runtime backed by a verified lifecycle kernel"
readme = "README.md"
keywords = ["plugins", "lifecycle", "verification", "dependency-injection"]
categories = ["development-tools", "asynchronous"]
include = ["src/**", "tests/**", "examples/**", "Cargo.toml", "README.md", "LICENSE", "NOTICE"]
publish = ["crates-io"]

# Keep the Rust import name used by the existing host API and examples.
[lib]
name = "cordis"

[features]
default = []
tokio = ["dep:tokio"]

[dependencies]
cordis-driver = { path = "../cordis-driver", version = "=0.2.0" }
cordis-kernel = { path = "../cordis-kernel", version = "=0.2.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

tokio = { version = "1", optional = true, features = ["rt", "sync"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "sync", "macros", "time"] }

[target.'cfg(windows)'.dependencies]
# Safe wrapper around a same-volume, write-through replacement; no host unsafe.
atomicwrites = "=0.4.4"

[lints]
workspace = true

[[example]]
name = "managed_app"
required-features = ["tokio"]
