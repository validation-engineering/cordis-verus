[package]
name = "cordis-plugin-api"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Versioned C ABI and Rust SDK for Cordis native plugins"
readme = "README.md"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[[example]]
name = "dynamic_fixture_v1"
crate-type = ["cdylib"]

[[example]]
name = "dynamic_fixture_v2"
crate-type = ["cdylib"]

[[example]]
name = "dynamic_fixture_fail"
crate-type = ["cdylib"]
