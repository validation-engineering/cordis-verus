[workspace]
members = ["crates/cordis-kernel", "crates/cordis-driver", "crates/cordis", "crates/cordis-node", "crates/cordis-plugin-api"]
default-members = ["crates/cordis-kernel", "crates/cordis-driver", "crates/cordis"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.98.1"
repository = "https://github.com/Stool233/cordis-verus"

[workspace.lints.rust]
unsafe_code = "forbid"

# Optimize distributed native bindings without dropping runtime diagnostics.
[profile.release]
debug-assertions = true
overflow-checks = true
